services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -hf
      - Qwen/Qwen3-1.7B-GGUF:Q8_0
      - -c
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - model-cache:/root/.cache
    expose:
      - "8080"
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      LLM_BASE_URL: http://model:8080/v1
    ports:
      - "8000:8000"
    depends_on:
      - model
    restart: unless-stopped

volumes:
  model-cache:

